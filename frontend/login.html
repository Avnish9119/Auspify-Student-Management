
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management System | Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #101b3f, #2456a6);
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 38px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: #2456a6;
      border-radius: 18px;
      font-size: 28px;
      font-weight: bold;
    }

    h1 {
      color: #172554;
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #64748b;
      text-align: center;
      font-size: 14px;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #334155;
      font-size: 14px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 13px 14px;
      margin-bottom: 19px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      background: #fff;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #2456a6;
      box-shadow: 0 0 0 3px rgba(36, 86, 166, 0.12);
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      color: #fff;
      background: #2456a6;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #173e80;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .footer {
      margin-top: 25px;
      padding-top: 18px;
      border-top: 1px solid #e2e8f0;
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 28px 22px;
      }
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="logo">S</div>

    <h1>Welcome Back</h1>
    <p class="subtitle">
      Student Management System<br>
      Sign in to access your account
    </p>

    <form id="loginForm">
      <label for="role">Login As</label>
      <select id="role" name="role" required>
        <option value="">Select your role</option>
        <option value="admin">Administrator</option>
        <option value="teacher">Teacher</option>
        <option value="student">Student</option>
      </select>

      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        name="username"
        placeholder="Enter your username"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">Sign In</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <div class="footer">
      Student Management System &copy; 2026
    </div>
  </main>

  <script>
    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const role = document.getElementById("role").value;
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      message.style.color = "#b45309";
      message.textContent = "Checking login details...";
      loginButton.disabled = true;

      try {
        const response = await fetch(
          "http://localhost:5001/api/login",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              username: username,
              password: password,
              role: role
            })
          }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          message.style.color = "#dc2626";
          message.textContent =
            data.message || "Login failed. Please check your details.";
          return;
        }

        sessionStorage.setItem(
          "loggedInUser",
          JSON.stringify(data.user)
        );

        message.style.color = "#15803d";
        message.textContent =
          "Login successful! Welcome, " + data.user.username + ".";
          setTimeout(() => {
  if (data.user.role === "admin") {
    window.location.href = "admin-dashboard.html";
  } else if (data.user.role === "teacher") {
    window.location.href = "teacher-dashboard.html";
  } else if (data.user.role === "student") {
    window.location.href = "student-dashboard.html";
  }
}, 700);

      } catch (error) {
        console.error("Login error:", error);
        message.style.color = "#dc2626";
        message.textContent =
          "Cannot connect to backend. Start the server and try again.";
      } finally {
        loginButton.disabled = false;
      }
    });
  </script>
</body>
</html>
